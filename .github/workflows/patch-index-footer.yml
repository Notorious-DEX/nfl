name: Patch homepage footer year

on:
  workflow_dispatch:
  push:
    branches:
      - feat/homepage-copyright-year

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node scripts/patch-index-footer.js
      - run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Use current year in homepage footer" && git push)
