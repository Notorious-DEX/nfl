name: Split Top Picks layout
on:
  workflow_dispatch:
  push:
    branches: [feat/top-picks-split]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node scripts/patch-top-picks-split.js
      - name: Commit
        run: |
          git config user.name 'GitHub Actions Bot'
          git config user.email 'actions@github.com'
          git add index.html
          git diff --staged --quiet || (git commit -m "Split Top Picks into High and Also this week [skip ci]" && git push)
