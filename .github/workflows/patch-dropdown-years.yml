name: patch-dropdown-years
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/season-automation
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node scripts/patch-dropdown-years.js
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Hide next-season dropdown until preseason prep"
          git push
