name: Patch homepage accuracy filters

on:
  workflow_dispatch:
  push:
    branches:
      - feat/homepage-accuracy-filters

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: python3 -c "import base64,pathlib; pathlib.Path('scripts/patch-accuracy-filters.js').write_bytes(base64.b64decode(pathlib.Path('scripts/patch-accuracy-filters.b64').read_text()))"
      - run: node scripts/patch-accuracy-filters.js
      - run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Add season and confidence filters to homepage accuracy" && git push)
