name: Fix week 3 slate
on:
  workflow_dispatch:
  push:
    branches: [fix/week3-slate]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node scripts/patch-week3-slate.js
      - name: Commit
        run: |
          git config user.name 'GitHub Actions Bot'
          git config user.email 'actions@github.com'
          git add scripts/cache-data.js index.html VERSION
          git diff --staged --quiet || (git commit -m "Fix week rollover and 2026 next-week fetch [skip ci]" && git push)
