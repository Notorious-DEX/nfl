name: Fix live score statuses
on:
  workflow_dispatch:
  push:
    branches: [fix/live-scores-all-in-game]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node scripts/patch-live-status.js
      - name: Commit
        run: |
          git config user.name 'GitHub Actions Bot'
          git config user.email 'actions@github.com'
          git add index.html VERSION
          git diff --staged --quiet || (git commit -m "Show live scores for halftime and between quarters [skip ci]" && git push)
