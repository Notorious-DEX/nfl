name: Cache NFL Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

    # Wednesday night kickoff (~8:20pm ET = 00:20 UTC Thursday)
    - cron: '30 3,4,5 * * 4'

    - cron: '15 20 * * 4'
    - cron: '15 23 * * 4'
    - cron: '0 0 * * 5'
    - cron: '30 3,4 * * 5'

    - cron: '0 16,19,20 * * 6'
    - cron: '0 23 * * 6'
    - cron: '0 0 * * 0'

    - cron: '0 17,20,21 * * 0'
    - cron: '15 23 * * 0'
    - cron: '5 0 * * 1'

    - cron: '15 20 * * 1'
    - cron: '15 23 * * 1'
    - cron: '0 0 * * 2'
    - cron: '30 3,4 * * 2'

permissions:
  contents: write

jobs:
  cache:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install node-fetch

      - name: Run cache script
        run: node scripts/patch-and-run.js scripts/cache-data.js

      - name: Apply market priors
        run: node scripts/apply-market-priors.js

      - name: Grade finished games
        run: node scripts/check-results.js

      - name: Commit and push cached data
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add cached-data.json cache-debug.log results.json prediction-archive.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update cached data [skip ci]" && git push)
