name: Patch live scores

on:
  workflow_dispatch:
  push:
    branches:
      - fix/live-scores-onload

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Decode known-good patch script
        run: python3 -c "import base64,pathlib; pathlib.Path('scripts/patch-live-scores.js').write_bytes(base64.b64decode(pathlib.Path('scripts/patch-live-scores.b64').read_text()))"
      - run: node scripts/patch-live-scores.js
      - run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Refresh live scores on first load and match prediction layout" && git push)
