name: NFL Predictions

on:
  schedule:
    - cron: '0 10 * * 2'
    - cron: '30 3,4,5 * * 4'
    - cron: '0 5 * * 5'
    - cron: '30 3,4 * * 5'
    - cron: '0 5 * * 0'
    - cron: '0 22 * * 0'
    - cron: '0 2 * * 1'
    - cron: '0 5 * * 1'
    - cron: '0 5 * * 2'
    - cron: '30 3,4 * * 2'
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'

permissions:
  contents: write

jobs:
  update-predictions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install node-fetch
      - name: Season gate
        id: gate
        run: node scripts/season-gate.js
      - name: Freeze finished season archive
        if: steps.gate.outputs.freeze == 'true'
        run: node scripts/freeze-season-archive.js
      - name: Check results
        if: steps.gate.outputs.active == 'true'
        run: node scripts/check-results.js
      - name: Generate predictions
        if: steps.gate.outputs.active == 'true'
        run: node scripts/generate-predictions.js
      - name: Commit and push if changed
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add predictions.json prediction-archive.json results.json data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update predictions and results [skip ci]" && git push)
