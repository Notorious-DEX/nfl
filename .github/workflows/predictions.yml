name: NFL Predictions

on:
  schedule:
    # Before the week starts
    - cron: '0 10 * * 2'

    # Wednesday night opener / late games (kickoff ~00:20 UTC Thursday)
    - cron: '30 3,4,5 * * 4'

    # Thursday night
    - cron: '0 5 * * 5'
    - cron: '30 3,4 * * 5'

    # Saturday
    - cron: '0 5 * * 0'

    # Sunday slate
    - cron: '0 22 * * 0'
    - cron: '0 2 * * 1'
    - cron: '0 5 * * 1'

    # Monday night
    - cron: '0 5 * * 2'
    - cron: '30 3,4 * * 2'

    # Daily backup
    - cron: '0 6 * * *'

  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'

permissions:
  contents: write

jobs:
  update-predictions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install node-fetch

      - name: Check results
        run: node scripts/check-results.js

      - name: Generate predictions
        run: node scripts/generate-predictions.js

      - name: Commit and push if changed
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add predictions.json prediction-archive.json results.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update predictions and results [skip ci]" && git push)
