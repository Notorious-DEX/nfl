name: Build Historical Elo Database

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-elo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install node-fetch
      - run: node scripts/build-historical-elo.js
      - run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add historical-elo.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Build historical Elo ratings database [skip ci]" && git push)
